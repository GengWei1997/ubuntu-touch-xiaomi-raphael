# oFono RIL configuration for raphael (SM8150).
#
# The focal ofono build has no ril_subscription.d include, so this replaces the
# main file. Same layout as the official nothing-spacewar port.

[Settings]
SetRadioCapability=off
emptyPinQuery=false
radioPowerCycle=false
confirmRadioPowerOn=false
startTimeout=40000

[ril_0]
transport=binder:name=slot1
name=slot1

[ril_1]
transport=binder:name=slot2
name=slot2
