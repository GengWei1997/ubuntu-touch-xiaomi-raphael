# usb-moded device configuration for Redmi K20 Pro (raphael / SM8150)
#
# https://docs.ubports.com/en/latest/porting/configure_test_fix/USBModed.html

# USB IDs of the stock firmware (2717 is Xiaomi's vendor ID).
IDVENDOR=2717
IDPRODUCT_MTP=FF20
IDPRODUCT_MTP_ADB=FF20
IDPRODUCT_RNDIS=FF20
IDPRODUCT_RNDIS_ADB=FF20

MANUFACTURER=Xiaomi
PRODUCT="Redmi K20 Pro"

# RNDIS autodetection fails here, so the function is named explicitly.
RNDIS_IFNAME=rndis0
RNDIS_FUNCTION=rndis.usb0

# -D raises the log level. -r (rescue mode) must stay off before publishing.
USB_MODED_ARGS="-D"
