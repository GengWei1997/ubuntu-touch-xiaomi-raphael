name: "Xiaomi Redmi K20 Pro"
codename: "raphael"
formfactor: "phone"
aliases: []
doppelgangers: []
user_actions:
  confirm_model:
    title: "Confirm your model"
    description: "Please double-check that your device is a Redmi K20 Pro (raphael). Note that the Redmi K20 Pro Premium Edition shares the codename but uses a different SoC and is not supported."
  confirm_os:
    title: "Confirm OS version"
    description: "Your device must be running the stock MIUI ROM based on Android 11 before installing Ubuntu Touch. With a previously installed custom ROM the firmware partitions may differ and the installation can fail."
  unlock_phone:
    title: "Unlock the bootloader"
    description: "Before installing another operating system you must unlock the bootloader of your phone. Xiaomi requires you to request permission in MIUI first, which can take several days."
    link: "https://en.miui.com/unlock/download_en.html"
  bootloader:
    title: "Reboot to Bootloader"
    description: "With the device powered off, press and hold the VOLUME DOWN button and the POWER button."
    image: "phone_power_down"
    button: true
  recovery:
    title: "Reboot to Recovery"
    description: "With the device powered off, press and hold the VOLUME UP button and the POWER button."
    image: "phone_power_up"
    button: true
unlock:
  - "confirm_model"
  - "confirm_os"
  - "unlock_phone"
operating_systems:
  - name: "Ubuntu Touch"
    compatible_installer: ">=0.9.6-beta"
    options:
      - var: "channel"
        name: "Channel"
        tooltip: "The release channel"
        link: "https://docs.ubports.com/en/latest/about/process/release-schedule.html"
        type: "select"
        remote_values:
          systemimage:channels:
      - var: "wipe"
        name: "Wipe Userdata"
        tooltip: "Wipe personal data. This is necessary for first time installations."
        type: "checkbox"
      - var: "bootstrap"
        name: "Bootstrap"
        tooltip: "Flash system partitions using fastboot"
        type: "checkbox"
        value: true
    prerequisites: []
    steps:
      ### Ensure we always start in bootloader mode
      - actions:
          - adb:reboot:
              to_state: "bootloader"
        fallback:
          - core:user_action:
              action: "bootloader"
      ### Ensure the bootloader has been unlocked already
      - actions:
          - fastboot:wait:
      - actions:
          - fastboot:assert_var:
              variable: "unlocked"
              value: "yes"
        fallback:
          - core:user_action:
              action: "unlock_phone"
      ### Flash boot, dtbo and recovery.
      ###
      ### These have to be uploaded to cdimage.ubports.com/devices/raphael/
      ### first; the checksums below must then be replaced with the SHA256 of
      ### the uploaded files. Until that upload exists this configuration cannot
      ### be used, which is expected - the images only get published once the
      ### port is merged upstream.
      - actions:
          - core:download:
              group: "firmware"
              files:
                - url: "https://cdimage.ubports.com/devices/raphael/boot.img"
                  checksum:
                    sum: "PENDING_SHA256_OF_boot.img"
                    algorithm: "sha256"
                - url: "https://cdimage.ubports.com/devices/raphael/dtbo.img"
                  checksum:
                    sum: "PENDING_SHA256_OF_dtbo.img"
                    algorithm: "sha256"
                - url: "https://cdimage.ubports.com/devices/raphael/recovery.img"
                  checksum:
                    sum: "PENDING_SHA256_OF_recovery.img"
                    algorithm: "sha256"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - fastboot:flash:
              partitions:
                - partition: "boot"
                  file: "boot.img"
                  group: "firmware"
                - partition: "dtbo"
                  file: "dtbo.img"
                  group: "firmware"
                - partition: "recovery"
                  file: "recovery.img"
                  group: "firmware"
        condition:
          var: "bootstrap"
          value: true
      ### Wipe userdata (if requested). raphael is A-only, so there is no slot to
      ### select and no logical partitions to resize.
      ###
      ### f2fs, not ext4: the partition carries f2fs on this device (magic
      ### 0xF2F52010 at offset 1024) and the Android container expects to find
      ### it that way again on every boot.
      - actions:
          - fastboot:format:
              partition: "userdata"
              type: "f2fs"
        condition:
          var: "wipe"
          value: true
      ### Systemimage installation steps
      - actions:
          - fastboot:reboot_recovery:
        fallback:
          - core:user_action:
              action: "recovery"
      - actions:
          - systemimage:install:
              verify_recovery: true
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
    slideshow: []
