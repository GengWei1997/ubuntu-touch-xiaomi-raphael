# usb-moded device overrides.
#
# path is left at the default: hard-coding /sys/class/power_supply/pc_port races
# with the smb5 driver registering that power supply.
#
# extcon_tracking is off: usb-moded probes every extcon device when no
# extcon_path is set, most of them report USB=0, and the last one read wins,
# which turns a PC connection into a charger.
[udev]
extcon_tracking = 0
